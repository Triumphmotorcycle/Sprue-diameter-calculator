<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10151b">
  <title>Sprue Diameter Calculator | Workshop Hub</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10151b;
      --panel: #191f27;
      --panel-light: #202833;
      --border: #303a46;
      --text: #edf2f7;
      --muted: #9ba8b7;
      --accent: #53d6c3;
      --accent-dark: #163e3b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 36px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent-dark);
      border: 1px solid #28645d;
      color: var(--accent);
      font-size: 19px;
    }

    .top-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .intro {
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 620px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .panel {
      padding: 26px;
      margin-bottom: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .step-label {
      color: var(--muted);
      font-size: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      background: #11171e;
      color: var(--text);
      border: 1px solid #3a4654;
      border-radius: 8px;
      font: inherit;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      min-height: 44px;
      padding: 11px 20px;
      border: 1px solid transparent;
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button {
      background: var(--accent);
      color: #10201e;
    }

    .primary-button:hover {
      background: #76e4d4;
    }

    .secondary-button {
      background: var(--panel-light);
      border-color: var(--border);
      color: var(--text);
    }

    .secondary-button:hover {
      background: #2a3542;
    }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px;
      margin-top: 22px;
      background: #132a29;
      border: 1px solid #28534e;
      border-radius: 10px;
    }

    .result-label {
      color: #b5cbc8;
      font-size: 13px;
    }

    .result-value {
      margin-top: 4px;
      color: var(--accent);
      font-size: clamp(24px, 4vw, 34px);
      font-weight: 750;
      letter-spacing: -0.035em;
    }

    .result-unit {
      color: #b5cbc8;
      font-size: 13px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    th {
      background: var(--panel-light);
      color: var(--muted);
      font-weight: 700;
    }

    td:last-child, th:last-child {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #202832;
    }

    .constant-button {
      padding: 5px 9px;
      min-height: 30px;
      background: var(--accent-dark);
      border-color: #28645d;
      color: var(--accent);
      font-size: 12px;
    }

    .note {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 650px) {
      body {
        padding: 22px 14px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .panel {
        padding: 19px;
      }

      .top-label {
        display: none;
      }

      .result {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }
    }
